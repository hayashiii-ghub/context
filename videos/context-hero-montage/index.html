<!DOCTYPE html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #050607;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #050607;
      }

      .footage-layer,
      .footage {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }

      .footage-layer {
        transform-origin: 50% 0%;
        will-change: transform, opacity;
        pointer-events: none;
      }

      .footage {
        object-fit: cover;
        object-position: 50% 0%;
      }

      #capture-layer {
        z-index: 1;
        opacity: 1;
      }

      #hold-layer {
        z-index: 2;
        opacity: 0;
      }

      #place-layer {
        z-index: 3;
        opacity: 0;
      }

      #return-layer {
        z-index: 4;
        opacity: 0;
      }

      #loop-layer {
        z-index: 5;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-ow2j" id="root" data-composition-id="main" data-start="0" data-duration="10.8" data-width="1920" data-height="1080">
      <div data-hf-id="hf-2vjg" id="capture-layer" class="footage-layer" data-layout-allow-overflow="">
        <video data-hf-id="hf-aaei" id="capture-footage" class="footage clip" src="assets/segments/capture.mp4" data-start="0" data-duration="3" data-track-index="1" muted playsinline preload="auto"></video>
      </div>

      <div data-hf-id="hf-bgm1" id="hold-layer" class="footage-layer" data-layout-allow-overflow="">
        <video data-hf-id="hf-9gi3" id="hold-footage" class="footage clip" src="assets/segments/hold.mp4" data-start="2.5" data-duration="3.3" data-track-index="2" muted playsinline preload="auto"></video>
      </div>

      <div data-hf-id="hf-ztt7" id="place-layer" class="footage-layer" data-layout-allow-overflow="">
        <video data-hf-id="hf-525p" id="place-footage" class="footage clip" src="assets/segments/place.mp4" data-start="5.3" data-duration="3.5" data-track-index="3" muted playsinline preload="auto"></video>
      </div>

      <div data-hf-id="hf-ilao" id="return-layer" class="footage-layer" data-layout-allow-overflow="">
        <video data-hf-id="hf-z9gu" id="return-footage" class="footage clip" src="assets/segments/return.mp4" data-start="8.3" data-duration="2.5" data-track-index="4" muted playsinline preload="auto"></video>
      </div>

      <div data-hf-id="hf-jgax" id="loop-layer" class="footage-layer">
        <video data-hf-id="hf-ts3x" id="loop-footage" class="footage clip" src="assets/segments/loop.mp4" data-start="10.35" data-duration="0.45" data-track-index="5" muted playsinline preload="auto"></video>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const cameras = {
        capture: { scale: 1 },
        hold: { scale: 1 },
        place: { scale: 1 },
        return: { scale: 1 },
      };

      const applyCamera = (selector, camera) => {
        gsap.set(selector, { scale: camera.scale });
      };

      Object.entries(cameras).forEach(([name, camera]) => {
        applyCamera(`#${name}-layer`, camera);
      });

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        cameras.capture,
        { scale: 1 },
        {
          scale: 1.012,
          duration: 3,
          ease: "sine.inOut",
          immediateRender: false,
          onUpdate: () => applyCamera("#capture-layer", cameras.capture),
        },
        0,
      );

      tl.fromTo(
        "#hold-layer",
        { opacity: 0 },
        {
          opacity: 1,
          duration: 0.16,
          ease: "power1.inOut",
          immediateRender: false,
        },
        2.6,
      );
      tl.fromTo(
        cameras.hold,
        { scale: 1 },
        {
          scale: 1.016,
          duration: 3.3,
          ease: "sine.inOut",
          immediateRender: false,
          onUpdate: () => applyCamera("#hold-layer", cameras.hold),
        },
        2.5,
      );

      tl.fromTo(
        "#place-layer",
        { opacity: 0 },
        {
          opacity: 1,
          duration: 0.16,
          ease: "power1.inOut",
          immediateRender: false,
        },
        5.4,
      );
      tl.fromTo(
        cameras.place,
        { scale: 1 },
        {
          scale: 1.02,
          duration: 3.5,
          ease: "sine.inOut",
          immediateRender: false,
          onUpdate: () => applyCamera("#place-layer", cameras.place),
        },
        5.3,
      );

      tl.fromTo(
        "#return-layer",
        { opacity: 0 },
        {
          opacity: 1,
          duration: 0.16,
          ease: "power1.inOut",
          immediateRender: false,
        },
        8.4,
      );
      tl.fromTo(
        cameras.return,
        { scale: 1 },
        {
          scale: 1.014,
          duration: 2.5,
          ease: "sine.inOut",
          immediateRender: false,
          onUpdate: () => applyCamera("#return-layer", cameras.return),
        },
        8.3,
      );

      tl.fromTo(
        "#loop-layer",
        { opacity: 0 },
        {
          opacity: 1,
          duration: 0.16,
          ease: "power1.inOut",
          immediateRender: false,
        },
        10.45,
      );

      window.__timelines.main = tl;
    </script>
  </body>
</html>
