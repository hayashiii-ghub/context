<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Draft</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        background: #0a0b0d;
        color: #f4f4f2;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 24%, rgba(65, 78, 98, 0.17), transparent 44%),
          #0a0b0d;
      }

      main { width: min(84vw, 660px); }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 620;
        letter-spacing: -0.025em;
      }

      .status { color: #8f9298; font-size: 13px; }

      #dropzone {
        min-height: 330px;
        display: grid;
        place-items: center;
        padding: 40px;
        border: 1px dashed #383b42;
        border-radius: 22px;
        background: rgba(18, 20, 24, 0.84);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
        transition: 160ms ease;
      }

      #dropzone.active {
        border-color: #deded9;
        background: rgba(28, 31, 36, 0.94);
        transform: scale(1.006);
      }

      .empty { text-align: center; }

      .mark {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
        border-radius: 14px;
        background: #f1f1ed;
        color: #111216;
        font-size: 26px;
        line-height: 1;
      }

      .title { margin: 0 0 7px; font-size: 19px; font-weight: 580; }
      .hint { margin: 0; color: #8f9298; font-size: 14px; }

      .file {
        width: min(100%, 460px);
        display: none;
        grid-template-columns: 44px 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 17px;
        border: 1px solid #303238;
        border-radius: 16px;
        background: #15171b;
      }

      .file.visible { display: grid; }

      .file-icon {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #26292f;
        font-size: 20px;
      }

      .file-name { font-size: 15px; font-weight: 560; }
      .file-meta { margin-top: 3px; color: #85888f; font-size: 12px; }
      .ready { color: #b8d5bd; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Project Draft</h1>
        <span class="status">Local workspace</span>
      </header>
      <section id="dropzone" aria-label="Drop files here">
        <div class="empty" id="empty">
          <div class="mark">↓</div>
          <p class="title">Drop a file to attach</p>
          <p class="hint">Your files stay on this Mac.</p>
        </div>
        <div class="file" id="file">
          <div class="file-icon">▤</div>
          <div>
            <div class="file-name" id="filename"></div>
            <div class="file-meta" id="filemeta"></div>
          </div>
          <div class="ready">Attached</div>
        </div>
      </section>
    </main>
    <script>
      const dropzone = document.querySelector('#dropzone');
      const empty = document.querySelector('#empty');
      const fileCard = document.querySelector('#file');
      const filename = document.querySelector('#filename');
      const filemeta = document.querySelector('#filemeta');

      for (const eventName of ['dragenter', 'dragover']) {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropzone.classList.add('active');
        });
      }

      for (const eventName of ['dragleave', 'drop']) {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropzone.classList.remove('active');
        });
      }

      dropzone.addEventListener('drop', (event) => {
        const [droppedFile] = event.dataTransfer.files;
        if (!droppedFile) return;
        filename.textContent = droppedFile.name;
        filemeta.textContent = `${Math.max(1, Math.round(droppedFile.size / 1024))} KB · Ready to use`;
        empty.hidden = true;
        fileCard.classList.add('visible');
      });
    </script>
  </body>
</html>
